<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../login/login.css">
</head>

<body>
    <form action="">
        <img src="../login/user_84308.png" alt="usuario-imagen">
        <label for="">Usuario</label>
        <input type="text" placeholder="Ingrese Nombre de Usuario" id="usuario" required>

        <label for="">Contraseña</label>
        <input type="password" placeholder="Ingrese Contraseña" id="contraseña" required>

        <input type="button" value="Iniciar Sesión" onclick="loguear()" class="btn-login">
    </form>

    <script src="../login/login.js"></script>
</body>

</html>
