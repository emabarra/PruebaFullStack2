<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../perfil-usuario/usuario.css">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg miClase">
            <div class="container-fluid">
                <a class="navbar-brand" href="../perfil-usuario/usuario.html">Menu Usuario</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="../principal/index.html">Pagina
                                Principal</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../historial-compras/historial-compras.html"><i
                                    class="bi bi-boxes"></i>Historial de compras</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                                aria-expanded="false">
                                <i class="bi bi-person-circle"></i>
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="../login/login.html">Cerrar
                                        Sesión</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>


    <main>
        <section id="contenido">
            <div class="contenido-contenedor">
                <div class="row">
                    <div class="mt-3">
                        <h4>Bienvenido Usuario</h4>
                        <br>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <section id="agregarUser">
        <div class="container-lg">
            <div class="mt-4">
                <h2>Tu Perfil</h2>
                <p class="lead">Datos Personales</p>
            </div>
            <div class="row-justify-content-center my-5">
                <div class="col-lg-6">
                    <div id="error" class="text-danger mb-3 fw-bold"></div>
                    <div id="exito" class="text-success mb-3 fw-bold"></div>
                    <!--Formulario-->

                    <form id="form">

                        <!-- Datos del usuario-->
                        <label for="nombreUser" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombreUser" placeholder="Eduardo">

                        <label for="apellidosUser" class="form-label">Apellidos</label>
                        <input type="text" class="form-control" id="apellidosUser" placeholder="Bonvallet">

                        <label for="correoUser" class="form-label">Correo Electronico</label>
                        <input type="email" class="form-control" id="correoUser"
                            placeholder="EduardoBonvallet@Duocuc.cl">

                        <label for="fechaNacUser" class="form-label">Fecha de nacimiento del usuario</label>
                        <input class="form-control" type="date" placeholder="Selecione la fecha de Nacimiento">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="regionUser" class="form-label">Región</label>
                                <select class="form-select" id="regionUser" required>
                                    <option value="">Seleccione una región...</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="comunaUser" class="form-label">Comuna</label>
                                <select class="form-select" id="comunaUser" required disabled>
                                    <option value="">Seleccione una comuna...</option>
                                </select>
                            </div>
                        </div>

                        <label for="direccionUser" class="form-label">Direccion del usuario</label>
                        <input type="text" class="form-control" id="direccionUser"
                            placeholder="e.g Avenida Siempre Viva 8723">


                        <div class="mt-4 text-center">
                            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>


    <footer class="footer">
        <div class="footer-contenido">
            <p>&copy Sitio web realizado por YZ spa - Versión 1.0</p>
            <div class="footer-nav">
                <a href="#">Políticas de Privacidad</a>
                <a href="#">Terminos y Condiciones</a>
                <a href="#">Ayuda</a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../perfil-usuario/usuario.js"></script>
</body>

</html>
